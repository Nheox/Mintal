#
# The F-Droid build recipe for Mintal.
#
# This file does not do anything inside this repository. It is the file that has to be
# added to F-Droid's own metadata repository, as
#
#     metadata/dev.nheox.mintal.yml
#
# in a merge request against https://gitlab.com/fdroid/fdroiddata. It is kept here so it
# is version-controlled with the app it describes, and so the version numbers at the
# bottom can be updated in the same commit that bumps them in app/build.gradle.kts.
#
# It is valid as it stands. The commented-out lines are optional fields worth filling in
# before the merge request; see docs/FDROID.md.
#
Categories:
  - Time

License: GPL-3.0-only

# AuthorName: the name that should appear as the app's author.
# AuthorEmail: an address for public metadata — a forwarding alias is wiser than a
# personal one.

SourceCode: https://github.com/Nheox/Mintal
IssueTracker: https://github.com/Nheox/Mintal/issues
Changelog: https://github.com/Nheox/Mintal/releases

# No donation address yet, by decision: ui/settings/Donation.kt holds an empty URL and
# the app's Settings card says so. When there is one, add the matching line here —
# Donate: for a plain URL, Liberapay: for a Liberapay handle.

RepoType: git
Repo: https://github.com/Nheox/Mintal.git

Builds:
  - versionName: 0.1.0
    versionCode: 1
    commit: v0.1.0
    subdir: app
    gradle:
      - yes

# Mintal ships nothing proprietary, downloads nothing at build or run time and declares
# no INTERNET permission, so there is no anti-feature to declare and nothing to strip in
# a prebuild step.

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 0.1.0
CurrentVersionCode: 1
