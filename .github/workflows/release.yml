name: Release

# Publishing a version is: bump versionCode and versionName in app/build.gradle.kts,
# write fastlane/metadata/android/en-US/changelogs/<versionCode>.txt, get it onto main,
# and then either
#
#     git tag v0.3.0
#     git push origin v0.3.0
#
# or, with no git at all, publish a release on GitHub's website with a new tag v0.3.0
# targeting main. Either way this builds the signed APK and attaches it to the release
# named after the tag. No APK is attached unless the tests pass and it really is signed.
#
# It needs four repository secrets (Settings -> Secrets and variables -> Actions):
#   MINTAL_KEYSTORE_BASE64    the keystore file, base64-encoded
#   MINTAL_KEYSTORE_PASSWORD  its password
#   MINTAL_KEY_ALIAS          the key's alias inside the keystore
#   MINTAL_KEY_PASSWORD       the key's password, often the same as the keystore's
#
# This signature is Mintal's identity on GitHub only. F-Droid builds from source and
# signs with its own key, so an F-Droid install and a release from here are two
# different apps as far as Android is concerned and cannot update each other.

on:
  push:
    tags: ["v*"]
  # A release published on the website creates its tag there and then. Whether that
  # also counts as a tag push has not been relied on: this trigger covers it either way,
  # and the concurrency group below plus a publish step that tolerates an existing
  # release make a double trigger cost a duplicate build, not a failure.
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Signed APK and GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install the SDK packages this project compiles against
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      # A tag that disagrees with the version in the build file would publish an APK
      # whose name and contents say different things, and the mistake is only visible
      # once someone has installed it.
      - name: Check the tag matches versionName
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -e
          TAG="${GITHUB_REF_NAME#v}"
          NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [ "$TAG" != "$NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $NAME in app/build.gradle.kts."
            echo "::error::Bump versionName (and versionCode) to match, or retag."
            exit 1
          fi
          echo "Tag and versionName agree on $NAME."

      - name: Decode the keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MINTAL_KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::MINTAL_KEYSTORE_BASE64 is empty or missing."
            echo "::error::Add the four signing secrets under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mintal-release.jks"

      - name: Unit tests and the signed APK
        env:
          MINTAL_KEYSTORE_FILE: ${{ runner.temp }}/mintal-release.jks
          MINTAL_KEYSTORE_PASSWORD: ${{ secrets.MINTAL_KEYSTORE_PASSWORD }}
          MINTAL_KEY_ALIAS: ${{ secrets.MINTAL_KEY_ALIAS }}
          MINTAL_KEY_PASSWORD: ${{ secrets.MINTAL_KEY_PASSWORD }}
        run: ./gradlew test assembleRelease

      # An APK the build could not sign is silently named -unsigned and cannot be
      # installed by anyone. Finding that out here is much cheaper than finding it out
      # from the first person who downloads it.
      - name: Check the APK is really signed
        run: |
          set -e
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          echo "Built $APK"
          case "$APK" in
            *unsigned*)
              echo "::error::The APK came out unsigned — the signing secrets were not picked up."
              exit 1
              ;;
          esac
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"
          VERSION="${GITHUB_REF_NAME:-dev}"
          VERSION="${VERSION//\//-}"
          mv "$APK" "mintal-${VERSION}.apk"
          echo "APK_PATH=mintal-${VERSION}.apk" >> "$GITHUB_ENV"

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # "What's new" comes from the same file F-Droid shows, so the two cannot say
          # different things about one version.
          CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          CHANGES="fastlane/metadata/android/en-US/changelogs/${CODE}.txt"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          {
          if [ -f "$CHANGES" ]; then
            printf "## What's new\n\n"
            cat "$CHANGES"
            printf "\n"
          fi
          cat <<'NOTES'
          ## Installing

          Install the `.apk` below on an Android phone (8.0 or newer). Your phone will ask
          you to allow installing from this source — that is Android's normal warning for
          anything not from the Play Store, not a problem with the file.

          To get updates automatically, add this repository to
          [Obtainium](https://github.com/ImranR98/Obtainium).

          Mintal has no internet permission, no account and no analytics. Everything stays
          on your device.
          NOTES
          } > "$NOTES_FILE"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # Published from the website, or by the other trigger a moment ago: the
            # release exists, so attach the APK to it. Words someone wrote there are kept;
            # an empty description gets the changelog and the install notes.
            gh release upload "$GITHUB_REF_NAME" "$APK_PATH" --clobber
            BODY=$(gh release view "$GITHUB_REF_NAME" --json body --jq '.body // ""')
            if [ -z "$BODY" ]; then
              gh release edit "$GITHUB_REF_NAME" \
                --title "Mintal $GITHUB_REF_NAME" \
                --notes-file "$NOTES_FILE"
            fi
          else
            gh release create "$GITHUB_REF_NAME" "$APK_PATH" \
              --title "Mintal $GITHUB_REF_NAME" \
              --notes-file "$NOTES_FILE"
          fi

      # Also kept as a build artifact, so a workflow_dispatch run (no tag, no release)
      # still produces something installable to test with.
      - name: Upload the APK as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mintal-release-apk
          path: mintal-*.apk
          if-no-files-found: warn
